name: Backend test

on: push

jobs:
  lint_test:
    name: Test backend code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: cd backend && uv pip install -e .[dev] --system

      - name: Run tests with coverage
        env:
          DB_CONNECTION: sqlite://tests.sqlite3
        run: |
          cd backend && python -m pytest --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: true
          flags: backend
          name: backend-coverage
          verbose: true
