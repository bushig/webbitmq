[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webbit"
version = "0.1.0"
description = "WebbitMQ application"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.115.12",
    "httpx==0.26.0",
    "uvicorn[standard]==0.34.0",
    "aio_pika==9.4.0",
    "websockets==12.0",
    "async-timeout==4.0.3",
    "redis==5.0.1",
    "hiredis==2.3.2",
    "tortoise-orm[accel]==0.24.2",
    "requests==2.31.0",
    "pydantic==2.10.6",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "mypy==1.8.0",
    "ruff==0.1.13",
    "asgi-lifespan==2.1.0",
    "pytest-cov==4.1.0",
    "coverage==7.2.7",
]

[tool.ruff]
# Enable Pyflakes (`F`), isort (`I`), pycodestyle (`E`), and Black-compatible formatter (`Q`)
lint.select = ["E", "F", "I", "Q", "W", "N", "B", "C4", "SIM", "TCH"]
lint.ignore = []

# Same line length as Black
line-length = 120

# Target Python 3.12
target-version = "py312"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Black-compatible formatting
line-ending = "auto"

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `Validator` decorator to trigger field name classification
classmethod-decorators = ["classmethod", "validator", "root_validator"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"
addopts = '''
  --strict-markers
  --tb=short
  --cov=webbit
  --cov=tests
  --cov-branch
  --cov-report=term-missing
  --cov-report=xml
  --no-cov-on-fail
  --cov-fail-under=80
'''

[tool.coverage.run]
branch = true
source = ["webbit", "tests"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.coverage.xml]
output = "coverage.xml"
